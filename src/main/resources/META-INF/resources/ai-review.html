<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../../META-INF/resources/CoQuaAI.png">
    <title>Code Quality Report Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <style>
        * {
            margin:  0;
            padding: 0;
            box-sizing:  border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: slideDown 0.6s ease-out;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size:  1.1em;
            opacity: 0.9;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.6s ease-out;
        }

        .stat-card .number {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 0.9em;
            color: #666;
        }

        .stat-high .number {
            color: #ef5350;
        }

        .stat-medium .number {
            color: #ffa726;
        }

        .stat-low .number {
            color: #66bb6a;
        }

        .issues-container {
            display: grid;
            gap: 20px;
        }

        .issue-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow:  0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border-left: 5px solid;
            animation: slideUp 0.6s ease-out;
        }

        .issue-card:hover {
            transform: translateY(-5px);
            box-shadow:  0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .issue-card.HIGH {
            border-left-color: #ef5350;
            background: linear-gradient(to right, rgba(239, 83, 80, 0.05), white);
        }

        .issue-card.MEDIUM {
            border-left-color: #ffa726;
            background: linear-gradient(to right, rgba(255, 167, 38, 0.05), white);
        }

        .issue-card.LOW {
            border-left-color: #66bb6a;
            background: linear-gradient(to right, rgba(102, 187, 106, 0.05), white);
        }

        .issue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .issue-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
        }

        .severity-badge {
            padding: 6px 14px;
            border-radius:  20px;
            font-size: 0.85em;
            font-weight:  600;
            color: white;
        }

        .severity-badge.HIGH {
            background: #ef5350;
        }

        .severity-badge.MEDIUM {
            background: #ffa726;
        }

        .severity-badge.LOW {
            background: #66bb6a;
        }

        .issue-message {
            font-size: 1em;
            color: #555;
            line-height: 1.6;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .issue-meta {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 15px;
            font-family: 'Consolas', 'Monaco', monospace;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.95em;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-test {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            justify-content: center;
            min-width: 200px;
        }

        .btn-test:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-test:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-test:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            color: white;
            padding: 60px 20px;
        }

        .empty-state h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        /* ===================== Modal ===================== */

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(30, 20, 50, 0.55);
            backdrop-filter: blur(3px);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.show {
            display: flex;
            opacity: 1;
        }

        .modal-box {
            background: white;
            border-radius: 16px;
            max-width: 680px;
            width: 100%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            transform: translateY(20px) scale(0.97);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .modal-overlay.show .modal-box {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .modal-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            padding: 24px 28px 16px;
            border-bottom: 1px solid #eee;
        }

        .modal-header-text h2 {
            font-size: 1.35em;
            color: #333;
            margin-bottom: 4px;
        }

        .modal-header-text .modal-subtitle {
            font-size: 0.85em;
            color: #888;
            font-family: 'Consolas', 'Monaco', monospace;
        }

        .modal-close {
            background: #f2f2f4;
            color: #666;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            min-width: 34px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1em;
            line-height: 1;
        }

        .modal-close:hover {
            background: #e6e6e9;
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 20px 28px 8px;
            overflow-y: auto;
            flex: 1;
        }

        .modal-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 40px 0;
            color: #764ba2;
        }

        .modal-loading .loader {
            width: 34px;
            height: 34px;
            border-width: 4px;
            border-color: rgba(118, 75, 162, 0.2);
            border-top-color: #764ba2;
        }

        .modal-error {
            background: #ffebee;
            border-left: 4px solid #ef5350;
            color: #c62828;
            padding: 16px;
            border-radius: 8px;
            line-height: 1.6;
        }

        .markdown-body {
            line-height: 1.7;
            color: #333;
            font-size: 0.98em;
            animation: fadeIn 0.4s ease-out;
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3 {
            margin: 18px 0 8px;
            color: #4c3d8f;
        }

        .markdown-body h1:first-child,
        .markdown-body h2:first-child,
        .markdown-body h3:first-child {
            margin-top: 0;
        }

        .markdown-body p {
            margin-bottom: 12px;
        }

        .markdown-body ul,
        .markdown-body ol {
            margin: 0 0 12px 22px;
        }

        .markdown-body li {
            margin-bottom: 6px;
        }

        .markdown-body code {
            background: #f2f0fa;
            color: #5b3fa0;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
        }

        .markdown-body pre {
            background: #2b2140;
            color: #f4f2fb;
            padding: 16px;
            border-radius: 10px;
            overflow-x: auto;
            margin-bottom: 14px;
        }

        .markdown-body pre code {
            background: none;
            color: inherit;
            padding: 0;
        }

        .markdown-body blockquote {
            border-left: 3px solid #764ba2;
            padding-left: 14px;
            color: #666;
            margin-bottom: 12px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 16px 28px 24px;
        }

        .btn-copy {
            background: #f2f0fa;
            color: #5b3fa0;
        }

        .btn-copy:hover {
            background: #e6e1f7;
        }

        .btn-copy.copied {
            background: #66bb6a;
            color: white;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .issue-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn-test {
                min-width: auto;
            }

            .modal-box {
                max-height: 90vh;
            }

            .modal-header,
            .modal-body,
            .modal-footer {
                padding-left: 18px;
                padding-right: 18px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📊 Code Quality Report</h1>
        <p>Analyze and improve your codebase architecture</p>
    </div>

    <div class="stats" id="stats"></div>

    <div class="issues-container" id="report"></div>

    <div class="empty-state" id="emptyState" style="display: none;">
        <h2>✨ No Issues Found</h2>
        <p>Your code quality is excellent! </p>
    </div>
</div>

<!-- AI Explanation Modal -->
<div class="modal-overlay" id="aiModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-header-text">
                <h2 id="modalTitle">🤖 AI Explanation</h2>
                <div class="modal-subtitle" id="modalSubtitle"></div>
            </div>
            <button class="modal-close" id="modalCloseBtn" aria-label="Close">✕</button>
        </div>
        <div class="modal-body" id="modalBody">
            <!-- populated dynamically -->
        </div>
        <div class="modal-footer">
            <button class="btn-copy" id="copyBtn" style="display:none;">📋 Copy</button>
        </div>
    </div>
</div>

<script>
    let currentExplanationText = '';

    async function loadReport() {
        try {
            const response = await fetch('/ai-review/report');

            if (!response.ok) {
                throw new Error("Failed to fetch report");
            }

            const data = await response.json();

            if (!data || data.length === 0) {
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('stats').innerHTML = '';
                return;
            }

            renderStats(data);
            renderIssues(data);

        } catch (error) {
            console.error("Error loading report:", error);
            document.getElementById('emptyState').style.display = 'block';
        }
    }

    function renderStats(data) {
        const stats = { HIGH: 0, MEDIUM: 0, LOW: 0 };

        data.forEach(issue => {
            if (stats[issue.severity] !== undefined) {
                stats[issue.severity]++;
            }
        });

        document.getElementById('stats').innerHTML = `
            <div class="stat-card stat-high">
                <div class="number">${stats.HIGH}</div>
                <div class="label">High Priority</div>
            </div>
            <div class="stat-card stat-medium">
                <div class="number">${stats.MEDIUM}</div>
                <div class="label">Medium Priority</div>
            </div>
            <div class="stat-card stat-low">
                <div class="number">${stats.LOW}</div>
                <div class="label">Low Priority</div>
            </div>
            <div class="stat-card">
                <div class="number">${stats.HIGH + stats.MEDIUM + stats.LOW}</div>
                <div class="label">Total Issues</div>
            </div>
        `;
    }

    function renderIssues(data) {
        const container = document.getElementById('report');
        container.innerHTML = '';

        data.forEach((issue, index) => {
            const card = document.createElement('div');
            card.className = `issue-card ${issue.severity}`;

            const metaParts = [];
            if (issue.file) metaParts.push(escapeHtml(issue.file));
            if (issue.line !== null && issue.line !== undefined) metaParts.push(`line ${issue.line}`);
            const metaLine = metaParts.length ? `<div class="issue-meta">📄 ${metaParts.join(' · ')}</div>` : '';

            card.innerHTML = `
                <div class="issue-header">
                    <div class="issue-title">${escapeHtml(issue.ruleName)}</div>
                    <span class="severity-badge ${issue.severity}">${issue.severity}</span>
                </div>
                ${metaLine}
                <div class="issue-message">
                    📌 ${escapeHtml(issue.message)}
                </div>
                <div class="action-buttons">
                    <button class="btn-test" data-index="${index}">
                        🤖 Ask AI for Solution
                    </button>
                </div>
            `;

            const btn = card.querySelector('.btn-test');
            btn.addEventListener('click', () => askAI(btn, issue));

            container.appendChild(card);
        });

        // Keep a reference to the raw data for the modal to read from
        window.__violationData = data;
    }

    async function askAI(button, issue) {
        console.log("Clicked");
        const originalLabel = button.innerHTML;

        button.disabled = true;
        button.innerHTML = '<span class="loader"></span> Analyzing...';

        openModal(issue);
        showModalLoading();

        try {
            const requestBody = {
                ruleName: issue.ruleName,
                severity: issue.severity,
                message: issue.message,
                file: issue.file || null,
                line: issue.line !== undefined ? issue.line : null
            };

            const response = await fetch('/ai-review/explain', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            // AiResponse only ever has { explanation }. On the Java side,
            // explain() can throw (e.g. "AI is disabled" or a Gemini call
            // failure), which Spring turns into its default JSON error body
            // ({ status, error, message, path, ... }) with a non-2xx status.
            let payload = null;
            try {
                payload = await response.json();
            } catch (parseErr) {
                // Response wasn't JSON at all (e.g. plain text 500 page)
            }

            if (!response.ok) {
                const backendMessage =
                    (payload && (payload.message || payload.error)) ||
                    `Request failed (HTTP ${response.status})`;
                showModalError(backendMessage);
            } else if (!payload || !payload.explanation) {
                showModalError('No explanation was returned. Please try again.');
            } else {
                showModalExplanation(payload.explanation);
            }

        } catch (err) {
            console.error('AI request failed:', err);
            showModalError('Failed to reach the AI service. Check your connection and try again.');
        } finally {
            button.disabled = false;
            button.innerHTML = originalLabel;
        }
    }

    // ===================== Modal helpers =====================

    function openModal(issue) {
        document.getElementById('modalTitle').textContent = `🤖 ${issue.ruleName}`;
        const metaParts = [issue.severity];
        if (issue.file) metaParts.push(issue.file);
        if (issue.line !== null && issue.line !== undefined) metaParts.push(`line ${issue.line}`);
        document.getElementById('modalSubtitle').textContent = metaParts.join(' · ');
        document.getElementById('copyBtn').style.display = 'none';
        currentExplanationText = '';
        document.getElementById('aiModal').classList.add('show');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        document.getElementById('aiModal').classList.remove('show');
        document.body.style.overflow = '';
    }

    function showModalLoading() {
        document.getElementById('modalBody').innerHTML = `
            <div class="modal-loading">
                <span class="loader"></span>
                <div>Asking Gemini for a fix...</div>
            </div>
        `;
    }

    function showModalError(message) {
        document.getElementById('modalBody').innerHTML = `
            <div class="modal-error">⚠️ ${escapeHtml(message)}</div>
        `;
        document.getElementById('copyBtn').style.display = 'none';
    }

    function showModalExplanation(explanationText) {
        currentExplanationText = explanationText;
        const html = renderMarkdown(explanationText);
        document.getElementById('modalBody').innerHTML = `<div class="markdown-body">${html}</div>`;

        const copyBtn = document.getElementById('copyBtn');
        copyBtn.style.display = 'inline-flex';
        copyBtn.classList.remove('copied');
        copyBtn.innerHTML = '📋 Copy';
    }

    function renderMarkdown(text) {
        if (typeof marked !== 'undefined') {
            try {
                return marked.parse(text);
            } catch (e) {
                console.warn('Markdown parsing failed, falling back to plain text.', e);
            }
        }
        // Fallback: escape and preserve line breaks if marked.js failed to load
        return `<p>${escapeHtml(text).replace(/\n/g, '<br>')}</p>`;
    }

    async function copyExplanation() {
        if (!currentExplanationText) return;

        const copyBtn = document.getElementById('copyBtn');
        try {
            await navigator.clipboard.writeText(currentExplanationText);
            copyBtn.classList.add('copied');
            copyBtn.innerHTML = '✅ Copied';
            setTimeout(() => {
                copyBtn.classList.remove('copied');
                copyBtn.innerHTML = '📋 Copy';
            }, 2000);
        } catch (err) {
            console.error('Clipboard copy failed:', err);
            copyBtn.innerHTML = '⚠️ Copy failed';
            setTimeout(() => { copyBtn.innerHTML = '📋 Copy'; }, 2000);
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text ?? '';
        return div.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadReport();

        document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
        document.getElementById('copyBtn').addEventListener('click', copyExplanation);

        document.getElementById('aiModal').addEventListener('click', (e) => {
            if (e.target.id === 'aiModal') closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    });
</script>
</body>
</html>
